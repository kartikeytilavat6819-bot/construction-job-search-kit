  "quantit* | take off* | takeoff* | cost estimat*": 0.5
  "permit*": 0.4
  "asset management | asset inventory": 0.5
  "eit | engineer in training | fundamentals of engineering | fe exam": 0.6

jd:
  on_target_terms: [transportation, traffic, roadway, highway, transit, rail, water, sewer, stormwater, drainage,
                    site civil, land development, grading, construction, inspection, field engineer, civil]
  off_target_terms: [geotechnical, soil boring, foundation design, structural design, structural analysis,
                     structural engineer, steel design, concrete design, bridge, pile*, marine, coastal, waterfront,
                     dredg*, electrical, mechanical, hvac, plumbing, substation, transmission line, power plant,
                     architect, semiconductor, software develop*, falsework, shoring, temporary works, risa, larsa,
                     materials testing, nuclear density, nuclear gauge, special inspect*, soil testing, soils testing,
                     proctor, compaction testing]
  entry_terms:
    - engineer in training
    - eit
    - engineer i
  penalty:
    terms: [substation, transmission line, transmission structure, overhead line, bus support*, power delivery,
            steel pole*, utility scale solar]
    min_hits: 2
    points: 0.8
    note: "power / substation work"
  degree_fields: [civil, engineering, construction]

rules:
  max_years_required: 2
  pe_license_required_is_blocker: true

disciplines:
  target: [transportation_traffic, highway_roadway, water_wastewater, stormwater_drainage, site_civil,
           construction_field_inspection, construction_management_estimating, civil_data_gis]
  neutral: [environmental, surveying]
  off_target: [geotechnical, structural_bridge, marine_coastal, electrical_mechanical_mep, software_it]

scoring:
  gold_at: 4.0
  silver_at: 3.3
  rules_only_gold_at: 3.9
  rules_only_silver_at: 3.0

ai:
  employer: "a US civil engineering firm"
  entry_level_titles: "Engineer I, EIT, Staff Engineer 1, Field Engineer, Inspector, New Grad, Associate/Assistant Engineer, Designer"
  off_target_work: "geotechnical / structural / bridge / waterfront-marine design as the primary discipline; an electrical / mechanical / architecture / pure software-IT role"
  discipline_hints: "a construction/CEI/field inspector is construction_field_inspection; a utility or water GIS role is civil_data_gis"
  degree_note: "a civil engineering degree counts for construction management, construction engineering, architectural engineering or any engineering field"
  learnable_software: [Procore, Primavera, Bluebeam, HCSS, Viewpoint, specific CAD add-ons]
  obtainable_certifications: [OSHA, CTQP, NICET, ACI, EIT/FE, PE later, driver's license]
  red_flags: "\"Engineer II\" or 2+ years preferred; a must-have state-DOT standard the candidate lacks; heavy structural/geotech share; a start date that does not fit the graduation date"
