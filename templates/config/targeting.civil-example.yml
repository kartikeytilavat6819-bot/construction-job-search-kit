# =====================================================================================================
#  targeting.civil-example.yml : the ORIGINAL civil-engineering values these scripts were tuned with
# =====================================================================================================
#
#  Reference only. This shows how the filters were set for an entry-level CIVIL engineer (transportation,
#  water/wastewater, site/civil, construction inspection; no geotechnical, structural, bridge or marine
#  work) so you can see how each setting is used. To use it, copy it to config/targeting.yml.
#  See templates/config/targeting.yml for the explanation of every section.
#
#  Big differences from the construction-management version:
#   * estimator, scheduler, safety coordinator and superintendent titles are REJECTED here (off-target
#     for a design engineer) but are TARGETS for construction management;
#   * structural / geotechnical / bridge / marine / power work is rejected, even inside "engineer" titles;
#   * the skills list is civil design and traffic software (Civil 3D, Synchro, ArcGIS ...).
# =====================================================================================================

field: "civil engineering (transportation / traffic, water / wastewater, site / civil, construction inspection)"

candidate:
  graduation: "Dec 2026"
  work_authorization: "on F-1 OPT; will need H-1B sponsorship later"

