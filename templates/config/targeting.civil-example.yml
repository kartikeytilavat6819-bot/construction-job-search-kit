  "excel": 0.2
  "vissim | synchro | simtraffic | sumo | hcm | highway capacity": 1.0
  "traffic signal* | traffic engineering | traffic impact | traffic study | traffic studies | traffic analysis | traffic operations | traffic count* | signal timing | level of service": 1.0
  "transportation planning | transportation engineering | roadway design | highway design | geometric design": 0.9
  "stormwater | drainage | hydraulic* | hydrolog*": 0.8
  "water distribution | water main* | sewer* | wastewater | water resources": 0.9
  "site design | site development | site civil | grading | land development | utility design": 0.8
  "construction inspection | construction observation | construction management | construction phase | construction administration | field inspection | inspect*": 0.9
