# Portal scanner config - CONSTRUCTION MANAGEMENT starter version
# (entry-level Project Engineer / APM / Field Engineer / Estimator / Owner's Rep, Boston first, then the US).
#
# USER LAYER: career-ops updates never overwrite this file. It is yours to edit.
# Check it after editing:            node validate-portals.mjs
# Check that every board answers:     node audit-portals.mjs --summary
# Add a company: append it to tracked_companies with its careers_url (and provider:/api: if it is not
# detected automatically - see docs/SUPPORTED_JOB_BOARDS.md). "enabled: false" pauses an entry.
#
# Each company comment notes its H-1B history from the US Department of Labor data (FY2020-2026, via the
# h1b-sponsor plugin, looked up 2026-10-14): "strong" = many recent filings, "weak" = a few, "none found" =
# no filings under that name. "None found" does not prove a firm never sponsors - ask early.

# How old a posting can be and still be picked up. 90 days keeps the "2027 new grad" campus postings
# that GCs (Turner, Suffolk, Gilbane...) leave open for months.
max_posting_age_days: 90

scan_history:
  recheck_after_days: 30

# F-1 OPT -> needs H-1B later: drop postings whose description explicitly refuses sponsorship
# ("no visa sponsorship", "U.S. citizens and permanent residents only", ...). Jobs with no description in
# the board feed always pass; every evaluation still checks sponsorship (modes/_profile.md).
visa_filter:
  enabled: true

# Job TITLE filter. A title must contain at least one "positive" phrase and no "negative" phrase.
# Matching ignores upper/lower case and matches parts of words ("Estimat" would match "Estimator").
#   word:XYZ  = whole word only (word:APM does not match "APMs" or "Rapid")
#   "A + B"   = the title must contain BOTH A and B
# Negatives always win, so "Manager" is NOT a negative (it would also remove "Assistant Project Manager").
# Plain senior titles ("Project Manager", "Superintendent", "Estimator" with 5+ years) are caught later
# by the evaluation's "3+ years = fail" rule.
title_filter:
  positive:
    # -- project engineering (the #1 entry title at GCs) --
    - "Project Engineer"
    - "Assistant Project Engineer"
    - "Field Engineer"
    - "Field Coordinator"
    - "Site Engineer"
    - "Construction Engineer"
    - "Office Engineer"
    # -- project management (entry level only) --
    - "Assistant Project Manager"
    - "Associate Project Manager"
    - "Junior Project Manager"
    - "Assistant Construction Manager"
    - "word:APM"
    - "Project Coordinator"
    - "Construction Coordinator"
    - "Project Analyst"
    - "Project Manager + word:I"
    # -- field operations --
    - "Assistant Superintendent"
    - "Assistant Super"
    - "Superintendent Trainee"
    - "Superintendent + Trainee"
    # -- estimating / preconstruction --
    - "Estimator"
    - "Estimating"
    - "Preconstruction"
    - "Pre-construction"
    - "Quantity Surveyor"
    - "Cost Estimator"
    # -- project controls --
    - "Scheduler"
    - "Scheduling"
    - "Project Controls"
    - "Project Control"
    - "Planning Engineer"
    - "Project Planner"
    - "Cost Engineer"
    - "Cost Control"
    - "Assistant Cost Manager"
    - "Associate Cost Manager"
    - "Junior Cost"
    # -- owner's rep / program management --
    - "Owner's Rep"
    - "Owner’s Rep"
    - "Owners Rep"
    - "Owner Rep"
    - "Owner's Project"
    - "Owner’s Project"
    - "Owners Project"
    - "Program Management + Associate"
    - "Program Coordinator + Construction"
    - "Construction Management"
    - "Construction Manager + Assistant"
    - "Construction Admin"
    # -- inspection / quality --
    - "Construction Inspector"
    - "Inspector"
    - "Quality Control"
    - "word:QA/QC"
    - "word:QC"
    - "Resident Engineer"
    # -- VDC / BIM --
    - "word:VDC"
    - "word:BIM"
    - "Virtual Design"
    # -- new-grad programs --
    - "New Grad"
    - "Recent Grad"
    - "Graduate Program"
    - "Early Career"
    - "Entry Level"
    - "Entry-Level"
    - "Rotational"
    - "Development Program + Construction"
    - "Construction + Trainee"
    - "Construction + Associate"
    - "Construction + Junior"
  negative:
    # -- too senior --
    - "Senior"
    - "word:Sr"
    - "word:Lead"
    - "Principal"
    - "Director"
