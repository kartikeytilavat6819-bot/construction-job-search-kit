# Web searches the agent runs during a scan (for employers without a scannable job board).
search_queries:
  - name: Boston entry-level project engineer (GC)
    query: '("project engineer" OR "assistant project engineer" OR "field engineer") construction "entry level" OR "new grad" (Boston OR Massachusetts)'
    enabled: true
  - name: New England assistant project manager / project coordinator
    query: '("assistant project manager" OR "project coordinator") construction (Boston OR Massachusetts OR "New England" OR Connecticut OR "Rhode Island")'
    enabled: true
  - name: Entry-level estimator / preconstruction
    query: '("assistant estimator" OR "junior estimator" OR "preconstruction coordinator") construction Massachusetts OR "New England"'
    enabled: true
  - name: Owner's project manager (OPM) firms in Massachusetts
    query: '("owner''s project manager" OR "owner''s representative") "assistant" OR "project coordinator" Massachusetts job'
    enabled: true
  - name: Massachusetts public construction jobs (NEOGOV)
    query: 'site:governmentjobs.com ("construction inspector" OR "project coordinator" OR "assistant project manager" OR "construction manager") Massachusetts'
    enabled: true
  - name: Construction project engineer roles that mention H-1B sponsorship
    query: '"project engineer" OR "field engineer" construction "visa sponsorship" OR "H-1B" entry level'
    enabled: true

# Companies whose job boards are read on every scan.
# "scan_method: local_parser" entries are read by the small Python scripts in local/ (shipped with this
# kit; they need Python 3 with requests + beautifulsoup4). Several of them search only the six New England
# states by design (noted per entry); the other boards cover the whole US and location_filter keeps US jobs.
tracked_companies:

  # =============================================================================================
  # 1. Boston / New England general contractors and CM-at-risk firms (Boston first)
